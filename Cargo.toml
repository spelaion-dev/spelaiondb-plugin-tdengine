[package]
# The program's name, which is what SpelaionDB's plugins.toml pins.
name = "spelaiondb-plugin-tdengine"
description = "TDengine for SpelaionDB, served as a plugin: TDengine through taosAdapter's WebSocket API"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-tdengine"
publish = false

[lib]
name = "spelaion_driver_tdengine"

[[bin]]
name = "spelaiondb-plugin-tdengine"
path = "src/bin/spelaiondb-plugin-tdengine.rs"

# The contract and the plugin's side of the protocol come from SpelaionDB's repository, by tag
# (ADR-042): one tag pins them together.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
futures-util = "0.3"
# taosAdapter's REST API, with rustls. TDengine's own Rust connector is not used: its WebSocket
# client pulls an unmaintained TLS stack with known advisories (ring 0.16, rustls 0.20).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.2.0" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
